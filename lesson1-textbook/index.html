<style>
/* Layout: one full-bleed 3D desk scene; a paper progress chip pinned top-left and a tour bar pinned bottom-centre */
:root{
  --desk:#e6dfd2;
  --hud-bg:rgba(251,249,244,.92);
  --hud-fg:#2a2833;
  --hud-mute:#6f6a78;
  --hud-line:rgba(42,40,51,.15);
  --accent:#d9572f;
  --co2:#2f7dff;
  --tag-bg:#fbf8f0;
  --tag-fg:#2a2833;
  --tag-line:#2a2833;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Gaegu","Apple SD Gothic Neo",cursive;
  --f-serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1d1c21; --hud-bg:rgba(34,33,40,.92); --hud-fg:#efebe3; --hud-mute:#aaa4b3;
    --hud-line:rgba(239,235,227,.16); --accent:#f07a52; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1d1c21; --hud-bg:rgba(34,33,40,.92); --hud-fg:#efebe3; --hud-mute:#aaa4b3;
  --hud-line:rgba(239,235,227,.16); --accent:#f07a52; color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--desk); color:var(--hud-fg); font-family:var(--f-ui);
  overflow:hidden; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
#c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}

/* progress chip */
#chip{
  position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:max(16px, env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:6px; padding:10px 14px 11px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:14px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); max-width:calc(100% - 32px);
}
#chip .eyebrow{font-size:12px; color:var(--hud-mute); letter-spacing:.04em}
#chip .name{font-family:var(--f-serif); font-weight:700; font-size:15px; text-wrap:balance}
#steps{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 0; padding:0; list-style:none}
#steps li{
  font-size:12px; padding:3px 9px 3px 7px; border-radius:999px; border:1px dashed var(--hud-line);
  color:var(--hud-mute); display:flex; align-items:center; gap:5px; transition:all .3s;
}
#steps li::before{content:""; width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor}
#steps li.on{border-style:solid; border-color:var(--accent); color:var(--accent)}
#steps li.on::before{background:var(--accent)}

/* tour bar */
#bar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(780px, calc(100% - 32px));
  display:flex; align-items:center; gap:4px; padding:6px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:999px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
#bar button{
  flex:none; width:40px; height:40px; border-radius:50%; border:0; background:transparent;
  color:var(--hud-fg); display:grid; place-items:center; cursor:pointer;
}
#bar button:hover{background:var(--hud-line)}
#bar button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#bar svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
#cap{flex:1; min-width:0; padding:0 8px; display:flex; flex-direction:column; gap:3px}
#capText{font-size:14px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
#dots{display:flex; gap:5px}
#dots button{width:18px!important; height:10px!important; border-radius:6px!important; padding:0; position:relative}
#dots button::after{content:""; position:absolute; inset:3px 4px; border-radius:3px; background:var(--hud-line)}
#dots button.on::after{background:var(--accent)}
#dots button:hover{background:transparent!important}
.sep{width:1px; height:24px; background:var(--hud-line); flex:none; margin:0 2px}
#bar button.off{opacity:.45}
@media (max-width:560px){
  #bar{flex-wrap:wrap; border-radius:20px; justify-content:center}
  #cap{order:-1; flex-basis:100%; padding:4px 8px 2px}
  .sep{display:none}
}

/* camera pad */
#pad{
  position:fixed; right:max(16px, env(safe-area-inset-right,0px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  display:flex; gap:8px; align-items:flex-end; padding:8px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:18px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#pad .dpad{display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px}
#pad .zoom{display:grid; grid-template-rows:repeat(2,44px); gap:4px}
#pad button{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--hud-line); background:transparent;
  color:var(--hud-fg); display:grid; place-items:center; cursor:pointer; padding:0;
}
#pad button:hover{background:var(--hud-line)}
#pad button:active,#pad button.held{background:var(--accent); color:#fff; border-color:var(--accent)}
#pad button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#pad svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#pad .home{font-size:11px; line-height:1.1; font-family:var(--f-ui)}
@media (max-width:560px){
  #pad{bottom:calc(132px + env(safe-area-inset-bottom,0px)); padding:6px; gap:6px}
  #pad .dpad{grid-template-columns:repeat(3,38px); grid-template-rows:repeat(3,38px)}
  #pad .zoom{grid-template-rows:repeat(2,38px)}
  #pad button{width:38px; height:38px}
}

/* scene labels */
#labels{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; left:0; top:0; white-space:nowrap;
  font-family:var(--f-hand); font-size:24px; line-height:1; color:var(--tag-fg);
  background:var(--tag-bg); border:1.5px solid var(--tag-line); border-radius:7px; padding:4px 10px 3px;
  opacity:0; transition:opacity .35s;
  box-shadow:2px 3px 0 rgba(42,40,51,.18);
}
.tag::after{content:""; position:absolute; left:50%; top:100%; width:1.5px; height:18px; background:var(--tag-line)}
.tag.show{opacity:1}
.tag.blue{color:#1f5fd1; border-color:#1f5fd1}
.tag.blue::after{background:#1f5fd1}

#toast{
  position:fixed; left:50%; transform:translateX(-50%);
  top:calc(16px + env(safe-area-inset-top,0px));
  background:var(--hud-fg); color:var(--desk); padding:9px 16px; border-radius:10px; font-size:14px;
  max-width:calc(100% - 32px); text-align:center; transition:opacity .3s; opacity:0; pointer-events:none;
}
#toast.show{opacity:1}
@media (max-width:760px){ #toast{top:auto; bottom:calc(118px + env(safe-area-inset-bottom,0px))} }

#veil{
  position:fixed; inset:0; display:grid; place-items:center; background:var(--desk);
  font-family:var(--f-serif); font-size:18px; color:var(--hud-mute); transition:opacity .6s;
}
#veil.gone{opacity:0; pointer-events:none}
@media (prefers-reduced-motion: reduce){ .tag,#toast,#veil,#steps li{transition:none} }
</style>

<script>
(function(){
  function showVeil(html){
    var v = document.getElementById('veil'); if (!v) return;
    v.classList.remove('gone');
    v.innerHTML = '<div style="max-width:36ch;text-align:center;line-height:1.7;padding:0 16px">' + html + '</div>';
  }
  window.__showVeil = showVeil;
  setTimeout(function(){
    if (!window.__bookReady) showVeil('3D 그림을 불러오지 못했어요.<br>페이지를 새로고침해 보세요.<br><small>학교 인터넷에서 cdn.jsdelivr.net 접속이 막혀 있으면 책이 보이지 않을 수 있어요.</small>');
  }, 15000);
  window.addEventListener('error', function(e){
    if (!window.__bookReady) showVeil('3D 그림을 여는 중에 문제가 생겼어요.<br>새로고침해 보세요.<br><small>' + String(e.message || '').slice(0, 120) + '</small>');
  });
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';

import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeIO = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOut = t => 1 - Math.pow(1-t,3);
const easeBack = t => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V = (x,y,z) => new THREE.Vector3(x,y,z);

const COL = { ink:'#2a2833', paper:'#f8f5ee', accent:'#d9572f', accentSoft:'#fbe3d5', mute:'#7a7482', co2:'#2f7dff', ok:'#2e7d55' };
const F = {
  serif:'"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif',
  sans:'"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
  hand:'"Nanum Pen Script","Gaegu","Apple SD Gothic Neo",cursive'
};
const INK = new THREE.Color(COL.ink);

/* ---------- renderer ---------- */
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
} catch (e) {
  $('#veil').textContent = '이 기기에서는 3D 그래픽을 켤 수 없어요. 브라우저의 하드웨어 가속을 켜 주세요.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e4dccd');
scene.fog = new THREE.Fog('#e4dccd', 10, 22);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 80);
camera.position.set(0.2, 7.5, 6.5);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.0; controls.maxDistance = 11; controls.maxPolarAngle = 1.36;
controls.screenSpacePanning = false; controls.panSpeed = 1.1;
controls.mouseButtons = { LEFT:-1, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.ROTATE };
controls.touches = { ONE:-1, TWO:THREE.TOUCH.DOLLY_ROTATE };
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); window.__showVeil && window.__showVeil('그래픽이 잠시 멈췄어요.<br>페이지를 새로고침해 주세요.'); });
controls.target.set(0.1, 0.3, 0.2);

scene.add(new THREE.HemisphereLight(0xfff8ee, 0xb7aa98, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.55);
sun.position.set(-3.4, 6.8, 4.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-4, right:4, top:4, bottom:-4, near:1, far:18 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ---------- ink-hatching material ---------- */
const BEND_GLSL = `
uniform float uBend; uniform float uNeck; uniform float uLen; uniform float uRad; uniform float uFlat; uniform float uArc;
void bendIt(inout vec3 p, inout vec3 n){
  float t = p.y;
  float bf = smoothstep(0.10, 0.26, t);
  float rs = mix(1.0, uRad, bf);
  float fs = mix(1.0, uFlat, bf);
  p.x *= rs; p.z *= rs*fs;
  n = normalize(vec3(n.x/max(rs,0.01), n.y/max(uLen,0.01), n.z/max(rs*fs,0.01)));
  float L = t*uLen;
  float s = max(L-uNeck, 0.0);
  float sa = min(s, uArc);
  float a = uBend*sa;
  float c = cos(a); float sn = sin(a);
  vec3 sp = vec3(0.0, L, 0.0);
  if (abs(uBend) > 1e-4) sp = vec3(-(1.0-c)/uBend, min(L,uNeck) + sn/uBend, 0.0) + vec3(-sn, c, 0.0)*(s - sa);
  p = sp + vec3(c, sn, 0.0)*p.x + vec3(0.0, 0.0, p.z);
  n = vec3(n.x*c - n.y*sn, n.x*sn + n.y*c, n.z);
}
`;
const HATCH_UNI = `
uniform vec3 uInk; uniform float uDensity; uniform vec3 uDir1; uniform vec3 uDir2;
uniform float uMode; uniform float uRadius; uniform float uHatch;
varying vec3 vHObj;
`;
const HATCH_OUT = `
float hLum = dot(outgoingLight, vec3(0.3333));
float hBase = max(dot(diffuseColor.rgb, vec3(0.3333)), 0.03);
float hShade = clamp(hLum / hBase, 0.0, 1.3);
float hDark = clamp(1.0 - hShade, 0.0, 1.0);
float hu1 = (uMode < 0.5 ? dot(vHObj, uDir1) : atan(vHObj.z, vHObj.x) * uRadius) * uDensity;
float ha1 = fwidth(hu1);
float hd1 = abs(fract(hu1) - 0.5);
float hw1 = 0.5 * mix(0.10, 0.66, hDark);
float hl1 = 1.0 - smoothstep(hw1 - ha1, hw1 + ha1, hd1);
hl1 *= 1.0 - smoothstep(0.22, 0.65, ha1);
float hu2 = dot(vHObj, uDir2) * uDensity * 1.15;
float ha2 = fwidth(hu2);
float hd2 = abs(fract(hu2) - 0.5);
float hw2 = 0.5 * 0.55 * smoothstep(0.40, 0.95, hDark);
float hl2 = (1.0 - smoothstep(hw2 - ha2, hw2 + ha2, hd2)) * step(0.004, hw2);
hl2 *= 1.0 - smoothstep(0.22, 0.65, ha2);
float hInk = max(hl1, hl2) * uHatch;
vec3 hCol = mix(diffuseColor.rgb * mix(0.84, 1.02, clamp(hShade, 0.0, 1.0)), outgoingLight, 0.32);
gl_FragColor = vec4(mix(hCol, uInk, hInk * 0.82), diffuseColor.a);
`;
function hatchMat(o){
  const m = new THREE.MeshLambertMaterial({ color:o.color, transparent:!!o.transparent, map:o.map||null });
  const u = {
    uInk:{value:INK}, uDensity:{value:o.density ?? 40},
    uDir1:{value:V(...(o.dir1||[1,0,0.4])).normalize()},
    uDir2:{value:V(...(o.dir2||[0,1,0.3])).normalize()},
    uMode:{value:o.cyl?1:0}, uRadius:{value:o.radius ?? 0.3}, uHatch:{value:o.amount ?? 1}
  };
  if (o.bend) Object.assign(u, o.bend);
  m.userData.u = u;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    let vs = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vHObj;\n' + (o.bend ? BEND_GLSL : ''));
    if (o.bend){

const FRES_VS = `varying vec3 vN; varying vec3 vV; varying float vNy;
void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); vNy = normal.y; gl_Position = projectionMatrix*mv; }`;
function glassMat(){

    uniforms:{ uInk:{value:INK}, uTint:{value:new THREE.Color('#dde8ec')} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:FRES_VS,
    fragmentShader:`uniform vec3 uInk; uniform vec3 uTint; varying vec3 vN; varying vec3 vV; varying float vNy;
void main(){ vec3 n = normalize(vN); float f = 1.0 - abs(dot(n, normalize(vV)));
  float rim = smoothstep(0.62, 0.97, f);
  float glint = smoothstep(0.045, 0.0, abs(n.x - 0.55)) * 0.22;
  vec3 c = mix(uTint, uInk, rim*0.9); c = mix(c, vec3(1.0), glint);
  gl_FragColor = vec4(c, 0.06 + 0.8*rim + glint*0.5);
#include <colorspace_fragment>
}`
  });
}
function liquidMat(){

    fragmentShader:`uniform vec3 uInk; uniform vec3 uCol; uniform vec3 uCloudCol; uniform float uCloud;
varying vec3 vN; varying vec3 vV; varying float vNy;
void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));

const bubbleMat = new THREE.ShaderMaterial({
  uniforms:{ uInk:{value:INK} }, transparent:true, depthWrite:false,

void main(){ vec4 mv = modelViewMatrix * instanceMatrix * vec4(position,1.0);
  vN = normalize(normalMatrix * mat3(instanceMatrix) * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`uniform vec3 uInk; varying vec3 vN; varying vec3 vV;

}

      setCaption('실험 끝! 왼쪽 페이지의 날개를 들어 정답을 확인해요.');
    }
    if (S.phase === 'done'){
      S.doneT += dt;
      if (S.doneT > 3 && !S.cues.toFlap){ S.cues.toFlap = true; if (!S.userCam && !S.flapOpen) flyTo(1, '왼쪽 페이지의 날개를 톡 눌러 들어 보세요.'); }
    }
    S.cardTimer += dt; if (S.cardTimer > 0.25){ S.cardTimer = 0; refreshCards(); }
  } else {
    updatePowder(powL, dt, null, 'flour'); updatePowder(powR, dt, null, 'soda');
  }

  // bubbles
  S.spawnAcc += 120*S.emit*dt;
  while (S.spawnAcc >= 1){
    S.spawnAcc -= 1;
    const b = B.find(b => !b.on); if (!b) break;
    const a = Math.random()*6.283, d = Math.sqrt(Math.random())*rIn(0.03)*0.85;
    Object.assign(b, { on:true, x:Math.cos(a)*d, z:Math.sin(a)*d, y:0.02 + Math.random()*0.06, s:0.008 + Math.random()*0.015, v:0.16 + Math.random()*0.22 });
  }
  const topY = FILL + S.foam*FOAM_MAX*0.7;
  for (let i=0;i<NB;i++){
    const b = B[i];
    if (b.on){
      b.v += 0.2*dt; b.y += b.v*dt; b.x += Math.sin(b.ph + b.y*22)*0.0015;
      const rm = rIn(b.y) - b.s - 0.01, r0 = Math.hypot(b.x, b.z); if (r0 > rm){ b.x *= rm/r0; b.z *= rm/r0; }
      if (b.y > topY) b.on = false;
    }
    dummy.position.set(b.x, b.y, b.z); dummy.scale.setScalar(b.on ? b.s : 0); dummy.updateMatrix();
    bubbles.setMatrixAt(i, dummy.matrix);
  }
  bubbles.instanceMatrix.needsUpdate = true;

  // foam
  const H = S.foam*FOAM_MAX;
  foamCol.visible = foamBits.visible = H > 0.004;
  if (foamCol.visible){
    foamCol.scale.y = H/FOAM_MAX;
    const k = smooth(0, 0.12, S.foam);
    for (let i=0;i<NF;i++){
      const f = FB[i], y = FILL + H*f.layer, r = Math.max(0, rIn(y) - 0.04)*f.rf;
      dummy.position.set(Math.cos(f.a)*r, y + Math.sin(time*6 + f.ph)*0.004, Math.sin(f.a)*r);
      dummy.scale.setScalar((0.026 + 0.034*f.sz)*k); dummy.updateMatrix(); foamBits.setMatrixAt(i, dummy.matrix);
    }
    foamBits.instanceMatrix.needsUpdate = true;
  }

  // CO2 ribbon + glow + sound
  const op = smooth(0.04, 0.3, S.emit);
  ribbon.visible = op > 0.01; ribbon.material.uniforms.uOp.value = op; ribbon.material.uniforms.uTime.value = time;
  glow.intensity = 0.34*S.emit + 0.04*S.inflate;
  if (fizzGain && actx){ fizzGain.gain.setTargetAtTime(soundOn ? S.emit*0.07*(0.6 + 0.4*Math.random()) : 0, actx.currentTime, 0.05); }

  // x-ray balloons
  S.xray = S.xrayUser || !!STOPS[stopIdx].xray && !tween || (!!STOPS[stopIdx].xray && tween && tween.t > tween.dur*0.6);
  S.xrayK = lerp(S.xrayK, S.xray ? 1 : 0, Math.min(1, dt*5));
  for (const b of [bL, bR]){
    b.mat.opacity = lerp(1, 0.3, S.xrayK);
    b.mat.depthWrite = S.xrayK < 0.05;
    b.hull.visible = S.xrayK < 0.5;
  }

  // flap + stamp
  if (S.flapOpen && flapPivot){ S.flapT = Math.min(1, S.flapT + dt/1.1); flapPivot.rotation.x = -1.95 * easeBack(S.flapT); }
  if (S.stampT >= 0 && stamp){
    S.stampT += dt; const k = clamp(S.stampT/0.35, 0, 1);
    stamp.scale.setScalar(lerp(1.9, 1, easeOut(k))); stamp.material.opacity = Math.min(1, k*1.3);
  }
}

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  for (const m of lineMats) m.resolution.set(w, h);
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let popT = -0.4, time = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  // drawing lifts off the page
  if (popT < 1.2){ popT += dt; const k = RM ? 1 : easeBack(clamp(popT/1.1, 0, 1)); app.scale.set(1, Math.max(0.001, k), 1); }
  if (tween){
    tween.t += dt; const k = easeIO(clamp(tween.t/tween.dur, 0, 1));
    camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= tween.dur) tween = null;
  }
  if (playing && !tween){ playTimer += dt; if (playTimer > 5){ playTimer = 0; flyTo(stopIdx + 1); } }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('#toast').classList.remove('show'); }
  applyHeld(dt);
  { // self-heal if the camera ever ends up at an invalid spot
    const p = camera.position, t = controls.target;
    if (!Number.isFinite(p.x + p.y + p.z + t.x + t.y + t.z)){
      const s = STOPS[stopIdx]; tween = null; p.set(...s.pos); t.set(...s.tgt);
    }
  }
  controls.update();
  keepInBounds();
  simulate(dt, time);
  updateTags();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(async () => {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`700 40px "Gowun Batang"`, '가나'), document.fonts.load(`400 40px "Gowun Batang"`, '가나'),
        document.fonts.load(`400 40px "Gowun Dodum"`, '가나'), document.fonts.load(`400 40px "Nanum Pen Script"`, '가나')
      ]),
      new Promise(r => setTimeout(r, 3500))
    ]);
  } catch (e) {}
  drawLeft(); drawRight(); buildFlap(); refreshCards();
  pickables = [fL.proxy, fR.proxy, flap, pageL.mesh, pageR.mesh];
  flyTo(0);
  $('#veil').classList.add('gone');
  window.__bookReady = true;
  requestAnimationFrame(frame);
})();
</script>
