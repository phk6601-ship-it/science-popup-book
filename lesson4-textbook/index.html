<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>연소 후의 변화</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>

/* Layout: full-bleed 3D lab bench on an open workbook; progress chip top-left, step bar bottom-centre, camera pad bottom-right, observation sheet slides over everything */
:root{
  --desk:#e6dfd2;
  --hud-bg:rgba(251,249,244,.93);
  --hud-fg:#2a2833;
  --hud-mute:#6f6a78;
  --hud-line:rgba(42,40,51,.15);
  --accent:#d9572f;
  --ok:#2e7d55;
  --co2:#2f7dff;
  --tag-bg:#fbf8f0; --tag-fg:#2a2833; --tag-line:#2a2833;
  --sheet-bg:#f8f5ee; --sheet-fg:#2a2833; --sheet-mute:#6f6a78; --sheet-line:#2a2833;
  --sheet-soft:#fbe3d5; --sheet-cell:#ffffff; --sheet-cover:#efe5cf; --sheet-ok:#e3f1e8; --sheet-bad:#fbe0dc;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Gaegu","Apple SD Gothic Neo",cursive;
  --f-serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1d1c21; --hud-bg:rgba(34,33,40,.93); --hud-fg:#efebe3; --hud-mute:#aaa4b3;
    --hud-line:rgba(239,235,227,.16); --accent:#f07a52; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1d1c21; --hud-bg:rgba(34,33,40,.93); --hud-fg:#efebe3; --hud-mute:#aaa4b3;
  --hud-line:rgba(239,235,227,.16); --accent:#f07a52; color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--desk); color:var(--hud-fg); font-family:var(--f-ui);
  overflow:hidden; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
#c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
button{font-family:inherit}

/* progress chip */
#chip{
  position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:max(16px, env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:6px; padding:10px 14px 11px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:14px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); max-width:calc(100% - 32px);
}
#chip .eyebrow{font-size:12px; color:var(--hud-mute); letter-spacing:.04em}
#chip .name{font-family:var(--f-serif); font-weight:700; font-size:15px; text-wrap:balance}
#steps{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 0; padding:0; list-style:none}
#steps li{
  font-size:12px; padding:3px 9px 3px 7px; border-radius:999px; border:1px dashed var(--hud-line);
  color:var(--hud-mute); display:flex; align-items:center; gap:5px; transition:all .3s;
}
#steps li::before{content:""; width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor}
#steps li.now{border-style:solid; border-color:var(--accent); color:var(--accent)}
#steps li.done{border-style:solid; border-color:var(--ok); color:var(--ok)}
#steps li.done::before{background:var(--ok)}

/* step bar */
#bar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(800px, calc(100% - 32px));
  display:flex; align-items:center; gap:4px; padding:6px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:999px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
#bar button{
  flex:none; height:40px; min-width:40px; border-radius:999px; border:0; background:transparent;
  color:var(--hud-fg); display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; padding:0 10px; font-size:14px;
}
#bar button:hover{background:var(--hud-line)}
#bar button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#bar svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
#bar #bSheet{background:var(--accent); color:#fff; padding:0 14px}
#bar #bSheet.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,87,47,.5)}50%{box-shadow:0 0 0 8px rgba(217,87,47,0)}}
#cap{flex:1; min-width:0; padding:0 8px; font-size:14px; line-height:1.4}
#capText{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
#bar button.off{opacity:.45}
.sep{width:1px; height:24px; background:var(--hud-line); flex:none; margin:0 2px}
@media (max-width:620px){
  #bar{flex-wrap:wrap; border-radius:20px; justify-content:center}
  #cap{order:-1; flex-basis:100%; padding:4px 8px 2px}
  .sep{display:none}
}

/* camera pad */
#pad{
  position:fixed; right:max(16px, env(safe-area-inset-right,0px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  display:flex; gap:8px; align-items:flex-end; padding:8px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:18px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#pad .dpad{display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px}
#pad .zoom{display:grid; grid-template-rows:repeat(2,44px); gap:4px}
#pad button{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--hud-line); background:transparent;
  color:var(--hud-fg); display:grid; place-items:center; cursor:pointer; padding:0;
}
#pad button:hover{background:var(--hud-line)}
#pad button:active,#pad button.held{background:var(--accent); color:#fff; border-color:var(--accent)}
#pad button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#pad svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#pad .home{font-size:11px; line-height:1.1}
@media (max-width:620px){
  #pad{bottom:calc(132px + env(safe-area-inset-bottom,0px)); padding:6px; gap:6px}
  #pad .dpad{grid-template-columns:repeat(3,38px); grid-template-rows:repeat(3,38px)}
  #pad .zoom{grid-template-rows:repeat(2,38px)}
  #pad button{width:38px; height:38px}
}

/* scene labels */
#labels{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; left:0; top:0; white-space:nowrap;
  font-family:var(--f-hand); font-size:24px; line-height:1; color:var(--tag-fg);
  background:var(--tag-bg); border:1.5px solid var(--tag-line); border-radius:7px; padding:4px 10px 3px;
  opacity:0; transition:opacity .3s; box-shadow:2px 3px 0 rgba(42,40,51,.18);
}
.tag::after{content:""; position:absolute; left:50%; top:100%; width:1.5px; height:16px; background:var(--tag-line)}
.tag.show{opacity:1}
.tag.blue{color:#1f5fd1; border-color:#1f5fd1}
.tag.blue::after{background:#1f5fd1}
.tag.orange{color:#c2461f; border-color:#c2461f}
.tag.orange::after{background:#c2461f}
.tag.big{font-size:28px}

#toast{
  position:fixed; left:50%; transform:translateX(-50%);
  top:calc(16px + env(safe-area-inset-top,0px));
  background:var(--hud-fg); color:var(--desk); padding:10px 16px; border-radius:10px; font-size:14px; line-height:1.45;
  max-width:min(520px, calc(100% - 32px)); text-align:center; transition:opacity .3s; opacity:0; pointer-events:none;
}
#toast.show{opacity:1}
@media (max-width:760px){ #toast{top:auto; bottom:calc(122px + env(safe-area-inset-bottom,0px))} }

/* observation card (실험하기 전) */
#card{
  position:fixed; top:calc(118px + env(safe-area-inset-top,0px)); left:max(16px, env(safe-area-inset-left,0px));
  width:min(300px, calc(100% - 32px)); background:var(--sheet-bg); color:var(--sheet-fg);
  border:2px solid var(--sheet-line); border-radius:12px; padding:12px 14px 14px; box-shadow:3px 4px 0 rgba(42,40,51,.2);
}
#card h3{margin:0 0 6px; font-family:var(--f-serif); font-size:17px}
#card ul{margin:0; padding-left:18px; font-size:14px; line-height:1.6}
#card .x{position:absolute; right:6px; top:6px; width:32px; height:32px; border:0; background:transparent; font-size:18px; cursor:pointer; color:var(--sheet-fg)}

#veil{
  position:fixed; inset:0; display:grid; place-items:center; background:var(--desk);
  font-family:var(--f-serif); font-size:18px; color:var(--hud-mute); transition:opacity .6s;
}
#veil.gone{opacity:0; pointer-events:none}

/* ---------- observation sheet ---------- */
#sheet{
  position:fixed; inset:0; z-index:20; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:rgba(30,28,36,.45);
  padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
.paper{
  max-width:880px; margin:0 auto; background:var(--sheet-bg); color:var(--sheet-fg);
  border-radius:10px; padding:22px 26px 30px; box-shadow:0 18px 50px rgba(0,0,0,.3);
  display:flex; flex-direction:column; gap:18px;
}
.paper header{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.paper .pg{font-size:12px; color:var(--sheet-mute); letter-spacing:.05em}
.paper h2{margin:4px 0 0; font-family:var(--f-serif); font-size:21px; line-height:1.4; text-wrap:balance}
.paper h2 b{color:var(--accent); margin-right:6px}
.btn{
  border:1.5px solid var(--sheet-line); background:var(--sheet-cell); color:var(--sheet-fg); border-radius:999px;
  padding:8px 16px; font-size:14px; cursor:pointer; min-height:40px;
}
.btn:hover{background:var(--sheet-soft)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--sheet-fg); color:var(--sheet-bg)}
.modes{display:flex; flex-wrap:wrap; gap:0; border:1.5px solid var(--sheet-line); border-radius:999px; overflow:hidden; align-self:flex-start}
.modes button{border:0; background:transparent; padding:9px 16px; font-size:14px; cursor:pointer; color:var(--sheet-fg); min-height:40px}
.modes button[aria-pressed="true"]{background:var(--sheet-fg); color:var(--sheet-bg)}
.note{margin:-8px 0 0; font-size:14px; color:var(--sheet-mute); line-height:1.6}
.tbl{border:2px solid var(--sheet-line); border-radius:8px; overflow:hidden}
.trow{display:grid; grid-template-columns:150px 1fr 1fr; border-top:1.5px solid var(--sheet-line)}
.trow:first-child{border-top:0}
.trow > div{padding:10px 12px; min-width:0}
.trow > div + div{border-left:1.5px solid var(--sheet-line)}
.thead > div{background:var(--sheet-soft); font-weight:700; font-family:var(--f-serif); text-align:center; font-size:15px}
.rlabel{background:#f1ece1; font-family:var(--f-serif); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.45}
.cell{display:flex; flex-direction:column; gap:8px; position:relative}
.cell.ok{background:var(--sheet-ok)}
.cell.bad{background:var(--sheet-bad)}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{
  border:1.5px solid rgba(42,40,51,.35); background:var(--sheet-cell); color:var(--sheet-fg); border-radius:10px;
  padding:7px 10px 7px 32px; font-size:14px; cursor:pointer; position:relative; text-align:left; line-height:1.35; min-height:40px;
}
.opt::before{content:""; position:absolute; left:9px; top:50%; width:15px; height:15px; margin-top:-8px; border:2px solid var(--sheet-line); border-radius:3px; background:var(--sheet-cell)}
.opt[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"]::before{background:var(--accent); border-color:var(--accent)}
.opt[aria-pressed="true"]::after{content:""; position:absolute; left:14px; top:50%; width:5px; height:9px; margin-top:-7px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg)}
.opt.pic{padding:6px 6px 6px 28px; max-width:116px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px}
.opt.pic svg{width:62px; height:74px}
.verdict{font-family:var(--f-hand); font-size:24px; line-height:1.1}
.verdict.ok{color:var(--ok)} .verdict.bad{color:#c2461f}
.ans{font-family:var(--f-hand); font-size:25px; line-height:1.2; color:#1f3f8f; display:flex; flex-direction:column; align-items:flex-start; gap:4px}
.ans svg{width:84px; height:100px}
.cover{
  position:absolute; inset:6px; border-radius:8px; border:1.5px dashed var(--sheet-line);
  background:repeating-linear-gradient(135deg, var(--sheet-cover) 0 10px, #e8dcc1 10px 20px);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
  font-size:14px; cursor:pointer; color:var(--sheet-fg); transform-origin:top center; transition:transform .55s cubic-bezier(.3,1.4,.5,1), opacity .4s;
}
.cover b{font-family:var(--f-hand); font-size:24px; font-weight:400}
.cover:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.cover.open{transform:perspective(500px) rotateX(-100deg); opacity:0; pointer-events:none}
.cell.flapcell{min-height:110px}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.score{font-family:var(--f-hand); font-size:26px; color:var(--ok)}
.block{border:1.5px solid var(--sheet-line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.block h3{margin:0; font-family:var(--f-serif); font-size:17px}
.block h3 .pill{display:inline-block; background:var(--accent); color:#fff; border-radius:999px; padding:2px 10px; font-size:13px; margin-right:8px; vertical-align:2px}
textarea{
  width:100%; box-sizing:border-box; min-height:84px; resize:vertical; border:0; border-bottom:2px dotted var(--sheet-line);
  background:repeating-linear-gradient(transparent 0 33px, rgba(42,40,51,.15) 33px 34px); line-height:34px;
  font-family:var(--f-hand); font-size:26px; color:#1f3f8f; padding:0 4px;
}
textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.example{position:relative; min-height:64px; border-radius:8px; background:var(--sheet-cell); padding:10px 12px; font-size:15px; line-height:1.6}
.self{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.selfitem{background:#fff3b8; border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; font-size:14px; line-height:1.5}
.selfitem small{display:inline-block; background:var(--sheet-fg); color:var(--sheet-bg); border-radius:6px; padding:0 6px; font-size:12px; margin-right:4px}
.faces{display:flex; gap:6px}
.face{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--sheet-line); background:var(--sheet-cell); cursor:pointer; padding:0; display:grid; place-items:center}
.face svg{width:30px; height:30px}
.face[aria-pressed="true"]{background:var(--accent)}
.face[aria-pressed="true"] svg *{stroke:#fff}
@media (max-width:640px){
  .paper{padding:16px 14px 22px}
  .trow{grid-template-columns:1fr 1fr}
  .trow > .rlabel{grid-column:1 / -1; border-left:0; justify-content:flex-start}
  .trow > .rlabel + div{border-left:0}
  .thead > div:first-child{display:none}
  .thead > div:nth-child(2){border-left:0}
  .self{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .tag,#toast,#veil,#steps li,.cover{transition:none} #bar #bSheet.pulse{animation:none} }

/* lesson 4 additions */
#dots{display:flex; gap:5px; margin-top:3px}
#dots button{width:18px!important; min-width:18px!important; height:10px!important; border-radius:6px!important; padding:0!important; position:relative}
#dots button::after{content:""; position:absolute; inset:3px 4px; border-radius:3px; background:var(--hud-line)}
#dots button.on::after{background:var(--accent)}
#dots button:hover{background:transparent!important}
#steps li.on{border-style:solid; border-color:var(--accent); color:var(--accent)}
#steps li.on::before{background:var(--accent)}
.tag.h2o{color:#0d7fb0; border-color:#38b6e8; background:#e3f5fd} .tag.h2o::after{background:#38b6e8}
.tag.co2{color:#5b4bb8; border-color:#7c6fd6; background:#eeebff} .tag.co2::after{background:#7c6fd6}
.tag.pink{color:#b0335f; border-color:#e57a9c; background:#fde8ef} .tag.pink::after{background:#e57a9c}
.tag.done{color:var(--ok); border-color:var(--ok)} .tag.done::after{background:var(--ok)}
#legend{position:fixed; left:max(16px, env(safe-area-inset-left,0px)); top:50%; transform:translateY(-40%); padding:12px 14px; border-radius:16px; z-index:4;
  background:var(--hud-bg); border:1px solid var(--hud-line); color:var(--hud-fg); font-family:var(--f-ui); font-size:14px; display:flex; flex-direction:column; gap:8px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
#legend b{font-size:13px}
#legend span{display:flex; align-items:center; gap:8px}
#legend i{width:14px; height:14px; border-radius:50%; border:2px solid #2a2833; display:inline-block}
@media (max-width:620px){ #legend{top:auto; bottom:calc(196px + env(safe-area-inset-bottom,0px)); transform:none; font-size:12px; padding:8px 10px} }
</style>
</head>
<body>
<a href="../" style="position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:30;font:13px 'Gowun Dodum',sans-serif;background:rgba(251,249,244,.92);color:#2a2833;border:1px solid rgba(42,40,51,.15);border-radius:999px;padding:8px 14px;text-decoration:none">← 목차</a>
<canvas id="c" tabindex="0" aria-label="펼쳐진 과학책 위의 3D 실험 장면"></canvas>
<div id="labels" aria-hidden="true"></div>

<section id="chip" aria-label="진행 상황">
  <span class="eyebrow">과학 6-2 · 2. 물질의 연소 · 탐구 4</span>
  <span class="name">연소 후의 변화가 궁금해!</span>
  <ol id="steps">
    <li data-k="p1">종이 예상</li><li data-k="o1">종이 실험</li><li data-k="p2">석회수 예상</li><li data-k="o2">석회수 실험</li><li data-k="sum">정리</li>
  </ol>
</section>

<div id="legend" hidden aria-live="polite"><b>생성된 물질 보기</b><span><i style="background:#38b6e8"></i>물 (수증기)</span><span><i style="background:#7c6fd6"></i>이산화 탄소</span></div>
<div id="toast" role="status" aria-live="polite"></div>

<nav id="bar" aria-label="둘러보기">
  <button id="bPrev" aria-label="이전 장면"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="bPlay" aria-label="자동 둘러보기"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
  <div id="cap"><span id="capText"></span><div id="dots"></div></div>
  <button id="bNext" aria-label="다음 장면"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button id="bReset" aria-label="처음부터 다시 하기"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7"/><path d="M4 4v4h4"/></svg></button>
</nav>

<section id="pad" aria-label="시점 조절">
  <div class="dpad">
    <button data-spin="-1" aria-label="책 왼쪽으로 돌리기" title="왼쪽으로 돌리기 (Q)"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 0114 1"/><path d="M5 4v5h5"/><path d="M8 17h8"/></svg></button>
    <button data-tilt="-1" aria-label="위에서 내려다보기" title="위에서 보기 (↑)"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>

const BEND_GLSL = `
uniform float uBend; uniform float uNeck; uniform float uLen; uniform float uRad; uniform float uFlat; uniform float uArc;
void bendIt(inout vec3 p, inout vec3 n){

`;
const HATCH_UNI = `
uniform vec3 uInk; uniform float uDensity; uniform vec3 uDir1; uniform vec3 uDir2;
uniform float uMode; uniform float uRadius; uniform float uHatch; uniform vec3 uGlow;
varying vec3 vHObj;

const HATCH_OUT = `
float hLum = dot(outgoingLight, vec3(0.3333));

float hShade = clamp(hLum / hBase, 0.0, 1.3);

float ha2 = fwidth(hu2);
float hd2 = abs(fract(hu2) - 0.5);

function wrap(c, text, maxW){

/* flames */
const FLAME_PROFILE = [[0,0],[0.02,0.012],[0.034,0.04],[0.04,0.075],[0.037,0.115],[0.028,0.16],[0.015,0.2],[0.005,0.226],[0,0.235]];
const flameGeo = lathe(FLAME_PROFILE, 28);
function flameMaterial(kind){
  return new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uOn:{value:0}, uKind:{value:kind}, uSeed:{value:Math.random()*10}, uCore:{value:0} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`uniform float uTime; uniform float uOn; uniform float uSeed; varying float vH; varying vec3 vN; varying vec3 vV;
void main(){ vec3 p = position; float h = clamp(p.y / 0.235, 0.0, 1.0);
  float sway = sin(uTime*7.0 + uSeed)*0.6 + sin(uTime*13.0 + uSeed*2.0)*0.4;
  p.x += sway * 0.012 * h*h; p.z += cos(uTime*9.0 + uSeed)*0.008*h*h;
  p.y *= 0.93 + 0.07*sin(uTime*15.0 + uSeed);
  p *= uOn; vH = h;
  vec4 mv = modelViewMatrix*vec4(p,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader:`uniform float uKind; uniform float uOn; uniform float uCore; varying float vH; varying vec3 vN; varying vec3 vV;
void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
  vec3 c; float a;
  if (uKind < 0.5){
    vec3 blue = vec3(0.20,0.32,1.0), yel = vec3(1.0,0.78,0.18), ora = vec3(1.0,0.42,0.06), core = vec3(0.95,0.45,0.12);
    c = mix(blue, yel, smoothstep(0.04, 0.26, vH)); c = mix(c, ora, smoothstep(0.62, 1.0, vH));
    c = mix(c, core, uCore);
    a = (0.95 - 0.55*smoothstep(0.55, 0.98, f)) * (1.0 - 0.6*smoothstep(0.85, 1.0, vH));
    a *= mix(0.55, 1.0, smoothstep(0.0, 0.1, vH));
  } else if (uKind < 1.5){
    vec3 blue = vec3(0.30,0.45,1.0), tip = vec3(1.0,0.6,0.3);
    c = mix(blue, tip, smoothstep(0.45, 0.95, vH) * 0.6);
    a = (0.5 - 0.32*smoothstep(0.5, 0.98, f)) * (1.0 - 0.5*smoothstep(0.8, 1.0, vH));
  } else {
    c = mix(vec3(0.3,0.45,1.0), vec3(1.0,0.7,0.25), smoothstep(0.2, 0.7, vH)); a = 0.85 - 0.5*f;
  }
  gl_FragColor = vec4(c, a * clamp(uOn*1.5, 0.0, 1.0));
#include <colorspace_fragment>
}`
  });
}
function radialTex(stops){
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const c = cv.getContext('2d');
  const g = c.createRadialGradient(64,64,0,64,64,64); stops.forEach(([o, col]) => g.addColorStop(o, col));
  c.fillStyle = g; c.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const HALO = radialTex([[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,255,255,.55)'],[0.6,'rgba(255,255,255,.12)'],[1,'rgba(255,255,255,0)']]);
const RAYS = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const c = cv.getContext('2d');
  c.translate(128,128);
  for (let i=0;i<18;i++){
    const a = i/18*Math.PI*2, len = i % 2 ? 92 : 124;
    const g = c.createLinearGradient(0,0,Math.cos(a)*len, Math.sin(a)*len);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.25,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(Math.cos(a-0.05)*20, Math.sin(a-0.05)*20); c.lineTo(Math.cos(a)*len, Math.sin(a)*len); c.lineTo(Math.cos(a+0.05)*20, Math.sin(a+0.05)*20); c.closePath(); c.fill();
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function makeFlame(kind){
  const group = new THREE.Group();
  const outer = new THREE.Mesh(flameGeo, flameMaterial(kind)); outer.renderOrder = 8; group.add(outer);
  let inner = null;
  if (kind < 2){
    inner = new THREE.Mesh(flameGeo, flameMaterial(kind)); inner.material.uniforms.uCore.value = 1;
    inner.scale.set(0.55, 0.62, 0.55); inner.position.y = 0.01; inner.renderOrder = 9; group.add(inner);
  } else group.scale.setScalar(0.35);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:HALO, color: kind === 0 ? '#ffb24d' : kind === 1 ? '#8fb0ff' : '#ffc070', transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0 }));
  halo.scale.setScalar(kind === 0 ? 0.9 : kind === 1 ? 0.42 : 0.5); halo.position.y = 0.1; halo.renderOrder = 7; group.add(halo);
  let light = null;
  if (kind < 2){ light = new THREE.PointLight(kind === 0 ? 0xffa64d : 0x9fb6ff, 0, 2.4, 1.6); light.position.y = 0.12; group.add(light); }
  return { kind, group, outer, inner, halo, light, on:0, target:0 };
}
function tickFlame(F, dt, time){
  F.on = lerp(F.on, F.target, Math.min(1, dt*(F.target > F.on ? 3 : 7)));
  if (F.target === 0 && F.on < 0.01) F.on = 0;
  const flick = 0.9 + 0.08*Math.sin(time*17 + F.kind*3) + 0.05*Math.sin(time*31 + F.kind);
  for (const m of [F.outer, F.inner]){ if (!m) continue; m.material.uniforms.uTime.value = time; m.material.uniforms.uOn.value = F.on; m.visible = F.on > 0.01; }
  F.halo.material.opacity = (F.kind === 0 ? 0.7 : F.kind === 1 ? 0.32 : 0.5) * F.on * flick;
  F.halo.visible = F.on > 0.01;
  if (F.light) F.light.intensity = (F.kind === 0 ? 0.55 : 0.14) * F.on * flick;
}

/* light + heat flows (Every Joule style energy view) */
function heatTube(pts, r){
  const m = ribbonMat(); m.uniforms.uCol.value.set('#ff5a1f');
  const t = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, r, 8, false), m); t.renderOrder = 6; return t;
}
function makeEnergy(kind){
  const g = new THREE.Group();
  const rays = new THREE.Sprite(new THREE.SpriteMaterial({ map:RAYS, color:'#ffa800', transparent:true, depthWrite:false, opacity:0 }));
  rays.scale.setScalar(kind === 0 ? 1.45 : 0.95); rays.position.y = 0.11; rays.renderOrder = 6; g.add(rays);
  const heat = [];
  for (let k=0;k<3;k++){
    const ox = (k-1)*0.045, pts = [];
    for (let s=0;s<=8;s++) pts.push(V(ox + Math.sin(s*0.9 + k*2)*0.035*(s/8 + 0.3), 0.24 + s*0.075, Math.cos(s*0.7 + k)*0.02));
    const t = heatTube(pts, 0.016); g.add(t); heat.push(t);
  }
  for (const sg of [-1, 1]){
    const pts = []; for (let s=0;s<=6;s++){ const u = s/6; pts.push(V(sg*(0.06 + u*0.42), 0.12 + Math.sin(u*Math.PI)*0.06 + u*0.08, Math.sin(u*5)*0.02)); }
    const t = heatTube(pts, 0.011); g.add(t); heat.push(t);
  }
  g.visible = false;
  return { g, rays, heat, k:0 };
}
function tickEnergy(E, on, power, dt, time){
  E.k = lerp(E.k, on ? 1 : 0, Math.min(1, dt*4));
  E.g.visible = E.k > 0.01;
  E.rays.material.opacity = 0.9*E.k*power*(0.82 + 0.18*Math.sin(time*5));
  E.rays.material.rotation += dt*0.12;
  E.heat.forEach((t, i) => { t.material.uniforms.uOp.value = E.k*(i < 3 ? 0.85 : 0.55)*power; t.material.uniforms.uTime.value = time + i*0.3; });
}

/* smoke puff when a flame goes out */
const SMOKE = radialTex([[0,'rgba(120,115,125,.7)'],[0.6,'rgba(120,115,125,.25)'],[1,'rgba(120,115,125,0)']]);
const puffs = [];
function puff(at){
  for (let k=0;k<7;k++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:SMOKE, transparent:true, depthWrite:false, opacity:0.8 }));
    s.position.copy(at).add(V((Math.random()-0.5)*0.04, k*0.02, (Math.random()-0.5)*0.04)); s.scale.setScalar(0.06);
    s.userData = { t:-k*0.12, vx:(Math.random()-0.5)*0.05 }; scene.add(s); puffs.push(s);
  }
}
function tickPuffs(dt){
  for (let i=puffs.length-1;i>=0;i--){
    const s = puffs[i]; s.userData.t += dt; const t = s.userData.t; if (t < 0) { s.visible = false; continue; }
    s.visible = true; s.position.y += dt*0.25; s.position.x += s.userData.vx*dt; s.scale.setScalar(0.06 + t*0.25); s.material.opacity = Math.max(0, 0.7 - t*0.45);
    if (t > 1.6){ scene.remove(s); puffs.splice(i, 1); }
  }
}

function makeOxygen(n){
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map:DOT, color:'#5d9bff', size:0.042, transparent:true, depthWrite:false, opacity:0 }));
  pts.renderOrder = 8; pts.frustumCulled = false;
  return { pts, geo, n, list:[], show:0 };

function oxSpawn(O, p){ if (O.list.length < O.n) O.list.push({ p:p.clone(), v:V((Math.random()-0.5)*0.1, (Math.random()-0.2)*0.1, (Math.random()-0.5)*0.1), eat:false }); }
// centre = jar base centre (world), flame = flame tip (world), burnRate = particles consumed per second
function tickOxygen(O, dt, time, centre, flame, burnRate, burning){
  let eatBudget = burning ? burnRate*dt : 0;
  O.acc = (O.acc || 0) + eatBudget;
  for (let i=O.list.length-1;i>=0;i--){
    const o = O.list[i];
    if (o.eat){ const d = flame.clone().sub(o.p); const L = d.length(); if (L < 0.02){ O.list.splice(i, 1); continue; } o.p.addScaledVector(d.normalize(), Math.min(L, dt*0.9)); continue; }
    o.v.x += (Math.random()-0.5)*dt*0.8; o.v.y += (Math.random()-0.5)*dt*0.8; o.v.z += (Math.random()-0.5)*dt*0.8;
    o.v.multiplyScalar(1 - dt*0.6); o.p.addScaledVector(o.v, dt*0.6);
    const rx = o.p.x - centre.x, rz = o.p.z - centre.z, rr2 = Math.hypot(rx, rz), lim = JAR_R - 0.03;
    if (rr2 > lim){ o.p.x = centre.x + rx/rr2*lim; o.p.z = centre.z + rz/rr2*lim; o.v.x *= -0.5; o.v.z *= -0.5; }
    const y0 = centre.y + 0.04, y1 = centre.y + JAR_H - 0.04;
    if (o.p.y < y0){ o.p.y = y0; o.v.y = Math.abs(o.v.y); } if (o.p.y > y1){ o.p.y = y1; o.v.y = -Math.abs(o.v.y); }
  }
  while (O.acc >= 1 && O.list.length){ O.acc -= 1;
    let best = -1, bd = 1e9; O.list.forEach((o, i) => { if (o.eat) return; const d = o.p.distanceToSquared(flame); if (d < bd){ bd = d; best = i; } });
    if (best < 0) break; O.list[best].eat = true; }
  if (!O.list.length) O.acc = 0;
  const arr = O.geo.attributes.position.array; let n = 0;
  for (const o of O.list){ arr[n*3] = o.p.x; arr[n*3+1] = o.p.y; arr[n*3+2] = o.p.z; n++; }
  O.geo.setDrawRange(0, n); O.geo.attributes.position.needsUpdate = true;
  O.pts.material.opacity = O.show; O.pts.visible = O.show > 0.01;
  return O.list.filter(o => !o.eat).length;
}

function cobaltMat(){
  return new THREE.ShaderMaterial({
    uniforms:{ uK:{value:0}, uInk:{value:INK} }, side:THREE.DoubleSide,
    vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform float uK; uniform vec3 uInk; varying vec2 vUv;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
void main(){
  vec2 p = vUv*vec2(3.0, 12.0);

  float edge = min(min(vUv.x, 1.0-vUv.x)*3.0, min(vUv.y, 1.0-vUv.y)*12.0);
  float wet = smoothstep(v - 0.08, v + 0.08, uK*1.25 - edge*0.15);

  c = mix(c, uInk, border*0.55);
  gl_FragColor = vec4(c, 1.0);
#include <colorspace_fragment>
}`
  });
}

function makeProducts(n, color){
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map:DOT, color, size:0.04, transparent:true, depthWrite:false, opacity:0 }));

}
// mode 'water': rise from the flame, drift out and stick on the jar wall
// mode 'co2' : rise, wander, sink; any that reach an open bottle are absorbed
function tickProducts(P, dt, time, centre, flame, emitRate, mode, bottle){
  if (emitRate > 0){ P.acc = (P.acc || 0) + emitRate*dt; while (P.acc >= 1){ P.acc -= 1; if (P.list.length < P.n) P.list.push({ p:flame.clone().add(V((Math.random()-0.5)*0.02, 0.03, (Math.random()-0.5)*0.02)), v:V((Math.random()-0.5)*0.12, 0.12 + Math.random()*0.4, (Math.random()-0.5)*0.12), stick:false, t:0, go:0.2 + Math.random()*1.2 }); } }
  const lim = JAR_R - 0.018, y0 = centre.y + 0.03, y1 = centre.y + JAR_H - 0.03;
  for (let i=P.list.length-1;i>=0;i--){
    const o = P.list[i]; o.t += dt;
    if (o.stick){ if (mode === 'water' && o.p.y > y0 + 0.02 && Math.random() < dt*0.3) o.p.y -= dt*0.04; continue; }
    if (mode === 'water'){
      const rx = o.p.x - centre.x, rz = o.p.z - centre.z, r = Math.hypot(rx, rz) || 1e-4;
      if (o.t > o.go){ o.v.x += rx/r*dt*0.6; o.v.z += rz/r*dt*0.6; o.v.y -= dt*0.1; }
      o.v.multiplyScalar(1 - dt*0.8); o.p.addScaledVector(o.v, dt);
      const r2 = Math.hypot(o.p.x - centre.x, o.p.z - centre.z);
      if (r2 >= lim || o.p.y >= y1){ if (r2 > 1e-4){ o.p.x = centre.x + (o.p.x - centre.x)/r2*lim; o.p.z = centre.z + (o.p.z - centre.z)/r2*lim; } o.p.y = Math.min(o.p.y, y1); o.stick = true; P.stuck++; }
    } else {
      o.v.x += (Math.random()-0.5)*dt*0.7; o.v.z += (Math.random()-0.5)*dt*0.7; o.v.y += (Math.random()-0.5)*dt*0.5 - (o.t > 1.2 ? dt*0.08 : 0);
      o.v.multiplyScalar(1 - dt*0.7); o.p.addScaledVector(o.v, dt*0.7);
      const rx = o.p.x - centre.x, rz = o.p.z - centre.z, r = Math.hypot(rx, rz);
      if (r > lim){ o.p.x = centre.x + rx/r*lim; o.p.z = centre.z + rz/r*lim; o.v.x *= -0.5; o.v.z *= -0.5; }
      if (o.p.y < y0){ o.p.y = y0; o.v.y = Math.abs(o.v.y); } if (o.p.y > y1){ o.p.y = y1; o.v.y = -Math.abs(o.v.y); }
      if (bottle && bottle.open){ const b = bottle.at; if (Math.hypot(o.p.x - b.x, o.p.z - b.z) < LB_R && o.p.y < b.y + LB_H + 0.02 && o.p.y > b.y){ P.list.splice(i, 1); P.absorbed++; continue; }
        if (o.t > 2 && Math.random() < dt*0.25){ o.v.x += (b.x - o.p.x)*0.6; o.v.z += (b.z - o.p.z)*0.6; o.v.y -= 0.05; } }
    }
  }
  const arr = P.geo.attributes.position.array; let k = 0;
  for (const o of P.list){ arr[k*3] = o.p.x; arr[k*3+1] = o.p.y; arr[k*3+2] = o.p.z; k++; }
  P.geo.setDrawRange(0, k); P.geo.attributes.position.needsUpdate = true;
  P.pts.material.opacity = P.show; P.pts.visible = P.show > 0.01;
}

  // reading view: the left page fills the screen width, and children scroll it like a document
  const READ_MIN = -0.95, READ_MAX = 0.95, READ_EL = 1.5;
  let readZ = 0.5;
  function readDist(){
    const asp = Number.isFinite(camera.aspect) && camera.aspect > 0 ? camera.aspect : 1.6;
    const hf = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * asp);
    return Math.max(1.5, 1.18 / Math.tan(hf));
  }
  function readPose(z){ const d = readDist(); return { tgt:V(-1.05, PAGE_Y, z), pos:V(-1.05, PAGE_Y + d*Math.sin(READ_EL), z + d*Math.cos(READ_EL)) }; }
  function readAt(z, dur = 1.2){
    readZ = clamp(z, READ_MIN, READ_MAX); const P = readPose(readZ);
    tween = { t:0, dur: RM ? 0.01 : dur, p0:camera.position.clone(), t0:controls.target.clone(), p1:P.pos, t1:P.tgt };
  }
  function scrollRead(dz, smooth){
    if (viewMode !== 'read') return;

    }
  });

  // in the whole-book view, a tap on the book chooses which side to look at
  const ray0 = new THREE.Raycaster(), ndc0 = new THREE.Vector2();
