<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>실험관찰 연소의 조건</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>

/* Layout: full-bleed 3D lab bench on an open workbook; progress chip top-left, step bar bottom-centre, camera pad bottom-right, observation sheet slides over everything */
:root{
  --desk:#e6dfd2;
  --hud-bg:rgba(251,249,244,.93);
  --hud-fg:#2a2833;
  --hud-mute:#6f6a78;
  --hud-line:rgba(42,40,51,.15);
  --accent:#d9572f;
  --ok:#2e7d55;
  --co2:#2f7dff;
  --tag-bg:#fbf8f0; --tag-fg:#2a2833; --tag-line:#2a2833;
  --sheet-bg:#f8f5ee; --sheet-fg:#2a2833; --sheet-mute:#6f6a78; --sheet-line:#2a2833;
  --sheet-soft:#fbe3d5; --sheet-cell:#ffffff; --sheet-cover:#efe5cf; --sheet-ok:#e3f1e8; --sheet-bad:#fbe0dc;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Gaegu","Apple SD Gothic Neo",cursive;
  --f-serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1d1c21; --hud-bg:rgba(34,33,40,.93); --hud-fg:#efebe3; --hud-mute:#aaa4b3;
    --hud-line:rgba(239,235,227,.16); --accent:#f07a52; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1d1c21; --hud-bg:rgba(34,33,40,.93); --hud-fg:#efebe3; --hud-mute:#aaa4b3;
  --hud-line:rgba(239,235,227,.16); --accent:#f07a52; color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--desk); color:var(--hud-fg); font-family:var(--f-ui);
  overflow:hidden; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
#c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
button{font-family:inherit}

/* progress chip */
#chip{
  position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:max(16px, env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:6px; padding:10px 14px 11px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:14px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); max-width:calc(100% - 32px);
}
#chip .eyebrow{font-size:12px; color:var(--hud-mute); letter-spacing:.04em}
#chip .name{font-family:var(--f-serif); font-weight:700; font-size:15px; text-wrap:balance}
#steps{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 0; padding:0; list-style:none}
#steps li{
  font-size:12px; padding:3px 9px 3px 7px; border-radius:999px; border:1px dashed var(--hud-line);
  color:var(--hud-mute); display:flex; align-items:center; gap:5px; transition:all .3s;
}
#steps li::before{content:""; width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor}
#steps li.now{border-style:solid; border-color:var(--accent); color:var(--accent)}
#steps li.done{border-style:solid; border-color:var(--ok); color:var(--ok)}
#steps li.done::before{background:var(--ok)}

/* step bar */
#bar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(800px, calc(100% - 32px));
  display:flex; align-items:center; gap:4px; padding:6px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:999px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
#bar button{
  flex:none; height:40px; min-width:40px; border-radius:999px; border:0; background:transparent;
  color:var(--hud-fg); display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; padding:0 10px; font-size:14px;
}
#bar button:hover{background:var(--hud-line)}
#bar button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#bar svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
#bar #bSheet{background:var(--accent); color:#fff; padding:0 14px}
#bar #bSheet.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,87,47,.5)}50%{box-shadow:0 0 0 8px rgba(217,87,47,0)}}
#cap{flex:1; min-width:0; padding:0 8px; font-size:14px; line-height:1.4}
#capText{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
#bar button.off{opacity:.45}
.sep{width:1px; height:24px; background:var(--hud-line); flex:none; margin:0 2px}
@media (max-width:620px){
  #bar{flex-wrap:wrap; border-radius:20px; justify-content:center}
  #cap{order:-1; flex-basis:100%; padding:4px 8px 2px}
  .sep{display:none}
}

/* camera pad */
#pad{
  position:fixed; right:max(16px, env(safe-area-inset-right,0px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  display:flex; gap:8px; align-items:flex-end; padding:8px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:18px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#pad .dpad{display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px}
#pad .zoom{display:grid; grid-template-rows:repeat(2,44px); gap:4px}
#pad button{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--hud-line); background:transparent;
  color:var(--hud-fg); display:grid; place-items:center; cursor:pointer; padding:0;
}
#pad button:hover{background:var(--hud-line)}
#pad button:active,#pad button.held{background:var(--accent); color:#fff; border-color:var(--accent)}
#pad button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#pad svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#pad .home{font-size:11px; line-height:1.1}
@media (max-width:620px){
  #pad{bottom:calc(132px + env(safe-area-inset-bottom,0px)); padding:6px; gap:6px}
  #pad .dpad{grid-template-columns:repeat(3,38px); grid-template-rows:repeat(3,38px)}
  #pad .zoom{grid-template-rows:repeat(2,38px)}
  #pad button{width:38px; height:38px}
}

/* scene labels */
#labels{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; left:0; top:0; white-space:nowrap;
  font-family:var(--f-hand); font-size:24px; line-height:1; color:var(--tag-fg);
  background:var(--tag-bg); border:1.5px solid var(--tag-line); border-radius:7px; padding:4px 10px 3px;
  opacity:0; transition:opacity .3s; box-shadow:2px 3px 0 rgba(42,40,51,.18);
}
.tag::after{content:""; position:absolute; left:50%; top:100%; width:1.5px; height:16px; background:var(--tag-line)}
.tag.show{opacity:1}
.tag.blue{color:#1f5fd1; border-color:#1f5fd1}
.tag.blue::after{background:#1f5fd1}
.tag.orange{color:#c2461f; border-color:#c2461f}
.tag.orange::after{background:#c2461f}
.tag.big{font-size:28px}

#toast{
  position:fixed; left:50%; transform:translateX(-50%);
  top:calc(16px + env(safe-area-inset-top,0px));
  background:var(--hud-fg); color:var(--desk); padding:10px 16px; border-radius:10px; font-size:14px; line-height:1.45;
  max-width:min(520px, calc(100% - 32px)); text-align:center; transition:opacity .3s; opacity:0; pointer-events:none;
}
#toast.show{opacity:1}
@media (max-width:760px){ #toast{top:auto; bottom:calc(122px + env(safe-area-inset-bottom,0px))} }

/* observation card (실험하기 전) */
#card{
  position:fixed; top:calc(118px + env(safe-area-inset-top,0px)); left:max(16px, env(safe-area-inset-left,0px));
  width:min(300px, calc(100% - 32px)); background:var(--sheet-bg); color:var(--sheet-fg);
  border:2px solid var(--sheet-line); border-radius:12px; padding:12px 14px 14px; box-shadow:3px 4px 0 rgba(42,40,51,.2);
}
#card h3{margin:0 0 6px; font-family:var(--f-serif); font-size:17px}
#card ul{margin:0; padding-left:18px; font-size:14px; line-height:1.6}
#card .x{position:absolute; right:6px; top:6px; width:32px; height:32px; border:0; background:transparent; font-size:18px; cursor:pointer; color:var(--sheet-fg)}

#veil{
  position:fixed; inset:0; display:grid; place-items:center; background:var(--desk);
  font-family:var(--f-serif); font-size:18px; color:var(--hud-mute); transition:opacity .6s;
}
#veil.gone{opacity:0; pointer-events:none}

/* ---------- observation sheet ---------- */
#sheet{
  position:fixed; inset:0; z-index:20; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:rgba(30,28,36,.45);
  padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
.paper{
  max-width:880px; margin:0 auto; background:var(--sheet-bg); color:var(--sheet-fg);
  border-radius:10px; padding:22px 26px 30px; box-shadow:0 18px 50px rgba(0,0,0,.3);
  display:flex; flex-direction:column; gap:18px;
}
.paper header{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.paper .pg{font-size:12px; color:var(--sheet-mute); letter-spacing:.05em}
.paper h2{margin:4px 0 0; font-family:var(--f-serif); font-size:21px; line-height:1.4; text-wrap:balance}
.paper h2 b{color:var(--accent); margin-right:6px}
.btn{
  border:1.5px solid var(--sheet-line); background:var(--sheet-cell); color:var(--sheet-fg); border-radius:999px;
  padding:8px 16px; font-size:14px; cursor:pointer; min-height:40px;
}
.btn:hover{background:var(--sheet-soft)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--sheet-fg); color:var(--sheet-bg)}
.modes{display:flex; flex-wrap:wrap; gap:0; border:1.5px solid var(--sheet-line); border-radius:999px; overflow:hidden; align-self:flex-start}
.modes button{border:0; background:transparent; padding:9px 16px; font-size:14px; cursor:pointer; color:var(--sheet-fg); min-height:40px}
.modes button[aria-pressed="true"]{background:var(--sheet-fg); color:var(--sheet-bg)}
.note{margin:-8px 0 0; font-size:14px; color:var(--sheet-mute); line-height:1.6}
.tbl{border:2px solid var(--sheet-line); border-radius:8px; overflow:hidden}
.trow{display:grid; grid-template-columns:150px 1fr 1fr; border-top:1.5px solid var(--sheet-line)}
.trow:first-child{border-top:0}
.trow > div{padding:10px 12px; min-width:0}
.trow > div + div{border-left:1.5px solid var(--sheet-line)}
.thead > div{background:var(--sheet-soft); font-weight:700; font-family:var(--f-serif); text-align:center; font-size:15px}
.rlabel{background:#f1ece1; font-family:var(--f-serif); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.45}
.cell{display:flex; flex-direction:column; gap:8px; position:relative}
.cell.ok{background:var(--sheet-ok)}
.cell.bad{background:var(--sheet-bad)}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{
  border:1.5px solid rgba(42,40,51,.35); background:var(--sheet-cell); color:var(--sheet-fg); border-radius:10px;
  padding:7px 10px 7px 32px; font-size:14px; cursor:pointer; position:relative; text-align:left; line-height:1.35; min-height:40px;
}
.opt::before{content:""; position:absolute; left:9px; top:50%; width:15px; height:15px; margin-top:-8px; border:2px solid var(--sheet-line); border-radius:3px; background:var(--sheet-cell)}
.opt[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"]::before{background:var(--accent); border-color:var(--accent)}
.opt[aria-pressed="true"]::after{content:""; position:absolute; left:14px; top:50%; width:5px; height:9px; margin-top:-7px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg)}
.opt.pic{padding:6px 6px 6px 28px; max-width:116px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px}
.opt.pic svg{width:62px; height:74px}
.verdict{font-family:var(--f-hand); font-size:24px; line-height:1.1}
.verdict.ok{color:var(--ok)} .verdict.bad{color:#c2461f}
.ans{font-family:var(--f-hand); font-size:25px; line-height:1.2; color:#1f3f8f; display:flex; flex-direction:column; align-items:flex-start; gap:4px}
.ans svg{width:84px; height:100px}
.cover{
  position:absolute; inset:6px; border-radius:8px; border:1.5px dashed var(--sheet-line);
  background:repeating-linear-gradient(135deg, var(--sheet-cover) 0 10px, #e8dcc1 10px 20px);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
  font-size:14px; cursor:pointer; color:var(--sheet-fg); transform-origin:top center; transition:transform .55s cubic-bezier(.3,1.4,.5,1), opacity .4s;
}
.cover b{font-family:var(--f-hand); font-size:24px; font-weight:400}
.cover:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.cover.open{transform:perspective(500px) rotateX(-100deg); opacity:0; pointer-events:none}
.cell.flapcell{min-height:110px}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.score{font-family:var(--f-hand); font-size:26px; color:var(--ok)}
.block{border:1.5px solid var(--sheet-line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.block h3{margin:0; font-family:var(--f-serif); font-size:17px}
.block h3 .pill{display:inline-block; background:var(--accent); color:#fff; border-radius:999px; padding:2px 10px; font-size:13px; margin-right:8px; vertical-align:2px}
textarea{
  width:100%; box-sizing:border-box; min-height:84px; resize:vertical; border:0; border-bottom:2px dotted var(--sheet-line);
  background:repeating-linear-gradient(transparent 0 33px, rgba(42,40,51,.15) 33px 34px); line-height:34px;
  font-family:var(--f-hand); font-size:26px; color:#1f3f8f; padding:0 4px;
}
textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.example{position:relative; min-height:64px; border-radius:8px; background:var(--sheet-cell); padding:10px 12px; font-size:15px; line-height:1.6}
.self{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.selfitem{background:#fff3b8; border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; font-size:14px; line-height:1.5}
.selfitem small{display:inline-block; background:var(--sheet-fg); color:var(--sheet-bg); border-radius:6px; padding:0 6px; font-size:12px; margin-right:4px}
.faces{display:flex; gap:6px}
.face{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--sheet-line); background:var(--sheet-cell); cursor:pointer; padding:0; display:grid; place-items:center}
.face svg{width:30px; height:30px}
.face[aria-pressed="true"]{background:var(--accent)}
.face[aria-pressed="true"] svg *{stroke:#fff}
@media (max-width:640px){
  .paper{padding:16px 14px 22px}
  .trow{grid-template-columns:1fr 1fr}
  .trow > .rlabel{grid-column:1 / -1; border-left:0; justify-content:flex-start}
  .trow > .rlabel + div{border-left:0}
  .thead > div:first-child{display:none}
  .thead > div:nth-child(2){border-left:0}
  .self{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .tag,#toast,#veil,#steps li,.cover{transition:none} #bar #bSheet.pulse{animation:none} }

/* lesson 3 additions */
.tag.o2{color:#1d56c4; border-color:#3b78e7; background:#e5efff}
.tag.o2::after{background:#3b78e7}
.tag.heat{color:#c23a12; border-color:#e0531f; background:#ffe7dc}
.tag.heat::after{background:#e0531f}
.tag.done{color:var(--ok); border-color:var(--ok)}
.tag.done::after{background:var(--ok)}
#acts{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(72px + env(safe-area-inset-bottom,0px));
  display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:calc(100% - 32px); z-index:4;
}
#acts button{
  border:1.5px solid var(--hud-fg); background:var(--hud-bg); color:var(--hud-fg); border-radius:999px;
  padding:8px 14px; font-size:14px; cursor:pointer; min-height:40px; display:inline-flex; gap:6px; align-items:center;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
#acts button.done{border-color:var(--ok); color:var(--ok)}
#acts button.done::before{content:"✓"}
#acts button.on{background:var(--hud-fg); color:var(--hud-bg)}
#acts button.go{background:var(--accent); border-color:var(--accent); color:#fff}
#acts button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (max-width:620px){ #acts{bottom:calc(122px + env(safe-area-inset-bottom,0px))} }
#gauge{position:fixed; left:max(16px, env(safe-area-inset-left,0px)); top:50%; transform:translateY(-40%); width:118px; padding:12px 12px 14px; border-radius:16px;
  background:var(--hud-bg); border:1px solid var(--hud-line); color:var(--hud-fg); z-index:4; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-family:var(--f-ui)}
#gauge .gt{font-size:14px; font-weight:700; margin-bottom:8px}
#gauge .bar{position:relative; height:200px; width:22px; border-radius:11px; border:2px solid var(--hud-fg); margin-left:6px; background:#fff}
#gauge .fill{position:absolute; left:2px; right:2px; bottom:2px; border-radius:8px; background:linear-gradient(to top, #6d8fd8, #f0a43a 55%, #e0461a); height:0}
#gauge .mk{position:absolute; left:-6px; width:34px; height:0; border-top:3px solid var(--hud-fg); display:none}
#gauge .mk span{position:absolute; left:40px; top:-11px; white-space:nowrap; font-size:12px; line-height:1.2; padding:2px 6px; border-radius:8px; background:#fff3e8; border:1px solid #e0531f; color:#c23a12}
#gauge .gs{font-size:12px; color:var(--hud-mute); margin-top:10px; line-height:1.4}
@media (max-width:620px){ #gauge{top:auto; bottom:calc(240px + env(safe-area-inset-bottom,0px)); transform:none; width:104px; padding:8px 10px} #gauge .bar{height:110px} #gauge .gs{display:none} }
.q{display:flex; flex-direction:column; gap:8px; padding-top:4px}
.q + .q{border-top:1px dashed rgba(42,40,51,.25); padding-top:14px}
.q .qt{font-weight:700; font-size:15px; line-height:1.5}
.q .lead{font-family:var(--f-hand); font-size:22px; line-height:1.2}
.q .cols{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.q .col{border:1.5px solid var(--sheet-line); border-radius:10px; padding:10px; background:var(--sheet-cell); display:flex; flex-direction:column; gap:8px; position:relative; min-height:96px}
.q .col h4{margin:0; font-size:14px}
.q .col.ok{border-color:var(--ok); box-shadow:inset 0 0 0 2px var(--ok)} .q .col.bad{border-color:#c2461f; box-shadow:inset 0 0 0 2px #c2461f}
.q .flapbox{position:relative; min-height:72px; border-radius:8px; background:var(--sheet-cell); padding:10px 12px; font-size:15px; line-height:1.6; border:1px solid rgba(42,40,51,.15)}
.q .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.q .row.ok .opt[aria-pressed="true"]{border-color:var(--ok); color:var(--ok)}
.q .row.bad .opt[aria-pressed="true"]{border-color:#c2461f; color:#c2461f}
.q .mini{font-size:13px; color:var(--sheet-mute)}
@media (max-width:640px){ .q .cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<a href="../" style="position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:30;font:13px 'Gowun Dodum',sans-serif;background:rgba(251,249,244,.92);color:#2a2833;border:1px solid rgba(42,40,51,.15);border-radius:999px;padding:8px 14px;text-decoration:none">← 목차</a>

<script>
(function(){
  function showVeil(html){
    var v = document.getElementById('veil'); if (!v) return;
    v.classList.remove('gone');
    v.innerHTML = '<div style="max-width:36ch;text-align:center;line-height:1.7;padding:0 16px">' + html + '</div>';
  }
  window.__showVeil = showVeil;
  setTimeout(function(){
    if (!window.__bookReady) showVeil('3D 그림을 불러오지 못했어요.<br>페이지를 새로고침해 보세요.<br><small>학교 인터넷에서 cdn.jsdelivr.net 접속이 막혀 있으면 보이지 않을 수 있어요.</small>');
  }, 15000);
  window.addEventListener('error', function(e){
    if (!window.__bookReady) showVeil('3D 그림을 여는 중에 문제가 생겼어요.<br>새로고침해 보세요.<br><small>' + String(e.message || '').slice(0, 120) + '</small>');
  });
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeIO = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOut = t => 1 - Math.pow(1-t,3);
const easeBack = t => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const hdist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

const COL = { ink:'#2a2833', paper:'#f8f5ee', accent:'#d9572f', accentSoft:'#fbe3d5', mute:'#7a7482', co2:'#2f7dff', ok:'#2e7d55', line:'#e0662f' };
const F = {
  serif:'"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif',
  sans:'"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
  hand:'"Nanum Pen Script","Gaegu","Apple SD Gothic Neo",cursive'
};
const INK = new THREE.Color(COL.ink);

/* ================= renderer ================= */
const canvas = $('#c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true }); }
catch (e) { window.__showVeil('이 기기에서는 3D 그래픽을 켤 수 없어요. 브라우저의 하드웨어 가속을 켜 주세요.'); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); window.__showVeil('그래픽이 잠시 멈췄어요.<br>페이지를 새로고침해 주세요.'); });

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e4dccd');
scene.fog = new THREE.Fog('#e4dccd', 10, 22);
const camera = new THREE.PerspectiveCamera(38, 1.6, 0.05, 80);
camera.position.set(1.2, 4.5, 6.0);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.0; controls.maxDistance = 11; controls.maxPolarAngle = 1.36;
controls.screenSpacePanning = false;
controls.mouseButtons = { LEFT:-1, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.ROTATE };
controls.touches = { ONE:-1, TWO:THREE.TOUCH.DOLLY_ROTATE };
controls.target.set(1.2, 0.8, 0.1);
canvas.addEventListener('contextmenu', e => e.preventDefault());

scene.add(new THREE.HemisphereLight(0xfff8ee, 0xb7aa98, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.55);
sun.position.set(-3.4, 6.8, 4.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-4, right:4, top:4, bottom:-4, near:1, far:18 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ================= ink-hatching materials ================= */
const BEND_GLSL = `
uniform float uBend; uniform float uNeck; uniform float uLen; uniform float uRad; uniform float uFlat; uniform float uArc;
void bendIt(inout vec3 p, inout vec3 n){
  float t = p.y;
  float bf = smoothstep(0.10, 0.26, t);
  float rs = mix(1.0, uRad, bf);
  float fs = mix(1.0, uFlat, bf);
  p.x *= rs; p.z *= rs*fs;
  n = normalize(vec3(n.x/max(rs,0.01), n.y/max(uLen,0.01), n.z/max(rs*fs,0.01)));
  float L = t*uLen;
  float s = max(L-uNeck, 0.0);
  float sa = min(s, uArc);
  float a = uBend*sa;
  float c = cos(a); float sn = sin(a);
  vec3 sp = vec3(0.0, L, 0.0);
  if (abs(uBend) > 1e-4) sp = vec3(-(1.0-c)/uBend, min(L,uNeck) + sn/uBend, 0.0) + vec3(-sn, c, 0.0)*(s - sa);
  p = sp + vec3(c, sn, 0.0)*p.x + vec3(0.0, 0.0, p.z);
  n = vec3(n.x*c - n.y*sn, n.x*sn + n.y*c, n.z);
}
`;
const HATCH_UNI = `
uniform vec3 uInk; uniform float uDensity; uniform vec3 uDir1; uniform vec3 uDir2;
uniform float uMode; uniform float uRadius; uniform float uHatch; uniform vec3 uGlow;
varying vec3 vHObj;
`;
const HATCH_OUT = `
float hLum = dot(outgoingLight, vec3(0.3333));
float hBase = max(dot(diffuseColor.rgb, vec3(0.3333)), 0.03);
float hShade = clamp(hLum / hBase, 0.0, 1.3);
float hDark = clamp(1.0 - hShade, 0.0, 1.0);
float hu1 = (uMode < 0.5 ? dot(vHObj, uDir1) : atan(vHObj.z, vHObj.x) * uRadius) * uDensity;
float ha1 = fwidth(hu1);
float hd1 = abs(fract(hu1) - 0.5);
float hw1 = 0.5 * mix(0.10, 0.66, hDark);
float hl1 = 1.0 - smoothstep(hw1 - ha1, hw1 + ha1, hd1);
hl1 *= 1.0 - smoothstep(0.22, 0.65, ha1);
float hu2 = dot(vHObj, uDir2) * uDensity * 1.15;
float ha2 = fwidth(hu2);
float hd2 = abs(fract(hu2) - 0.5);
float hw2 = 0.5 * 0.55 * smoothstep(0.40, 0.95, hDark);
float hl2 = (1.0 - smoothstep(hw2 - ha2, hw2 + ha2, hd2)) * step(0.004, hw2);
hl2 *= 1.0 - smoothstep(0.22, 0.65, ha2);
float hInk = max(hl1, hl2) * uHatch;
vec3 hCol = mix(diffuseColor.rgb * mix(0.84, 1.02, clamp(hShade, 0.0, 1.0)), outgoingLight, 0.32) + uGlow;
gl_FragColor = vec4(mix(hCol, uInk, hInk * 0.82), diffuseColor.a);
`;
function hatchMat(o){
  const m = new THREE.MeshLambertMaterial({ color:o.color, transparent:!!o.transparent, map:o.map||null });
  const u = {
    uInk:{value:INK}, uDensity:{value:o.density ?? 40},
    uDir1:{value:V(...(o.dir1||[1,0,0.4])).normalize()},
    uDir2:{value:V(...(o.dir2||[0,1,0.3])).normalize()},
    uMode:{value:o.cyl?1:0}, uRadius:{value:o.radius ?? 0.3}, uHatch:{value:o.amount ?? 1},
    uGlow:{value:new THREE.Color(0,0,0)}
  };
  if (o.bend) Object.assign(u, o.bend);
  m.userData.u = u;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    let vs = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vHObj;\n' + (o.bend ? BEND_GLSL : ''));
    if (o.bend){
      vs = vs.replace('#include <beginnormal_vertex>',
        'vec3 objectNormal = vec3(normal);\nvec3 bentPos = vec3(position);\nbendIt(bentPos, objectNormal);\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif')
        .replace('#include <begin_vertex>', 'vec3 transformed = bentPos;\nvHObj = vec3(position.x*uRad, position.y*uLen, position.z*uRad);');
    } else {
      vs = vs.replace('#include <begin_vertex>', '#include <begin_vertex>\nvHObj = transformed;');
    }
    sh.vertexShader = vs;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + HATCH_UNI)
      .replace('#include <opaque_fragment>', HATCH_OUT);
  };
  m.customProgramCacheKey = () => 'hatch' + (o.bend ? 'B' : '');
  return m;
}
function bendDepth(U){
  const m = new THREE.MeshDepthMaterial({ depthPacking:THREE.RGBADepthPacking });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + BEND_GLSL)
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position);\nvec3 bnT = vec3(normal);\nbendIt(transformed, bnT);');
  };
  m.customProgramCacheKey = () => 'bendDepth';
  return m;
}
function hullMat(U){
  return new THREE.ShaderMaterial({
    uniforms:{ ...U, uOut:{value:0.0075}, uInk:{value:INK} },
    side:THREE.BackSide,
    vertexShader: BEND_GLSL + `
uniform float uOut;
void main(){ vec3 p = position; vec3 n = normal; bendIt(p, n); p += normalize(n)*uOut;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
    fragmentShader:`
uniform vec3 uInk;
void main(){ gl_FragColor = vec4(uInk, 1.0);
#include <colorspace_fragment>
}`
  });
}
const lineMats = [];
function lineMat(width, color){
  const lm = new LineMaterial({ color:(color ? new THREE.Color(color) : INK).getHex(), linewidth:width });
  lm.resolution.set(innerWidth || 1280, innerHeight || 800); lineMats.push(lm); return lm;
}
function inkEdges(geo, width=1.5, thresh=25){
  return new LineSegments2(new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(geo, thresh)), lineMat(width));
}
function ringLines(rings, width=1.3, color){
  const pts = [];
  for (const [r, y] of rings){ const n = 72; for (let i=0;i<n;i++){ const a0 = i/n*Math.PI*2, a1 = (i+1)/n*Math.PI*2; pts.push(Math.sin(a0)*r, y, Math.cos(a0)*r, Math.sin(a1)*r, y, Math.cos(a1)*r); } }
  return new LineSegments2(new LineSegmentsGeometry().setPositions(pts), lineMat(width, color));
}
function withEdges(mesh, width, thresh){ mesh.add(inkEdges(mesh.geometry, width, thresh)); return mesh; }

const FRES_VS = `varying vec3 vN; varying vec3 vV; varying float vNy; varying float vY;
void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); vNy = normal.y; vY = position.y; gl_Position = projectionMatrix*mv; }`;
function glassMat(tint='#dde8ec'){
  return new THREE.ShaderMaterial({
    uniforms:{ uInk:{value:INK}, uTint:{value:new THREE.Color(tint)} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:FRES_VS,
    fragmentShader:`uniform vec3 uInk; uniform vec3 uTint; varying vec3 vN; varying vec3 vV; varying float vNy; varying float vY;
void main(){ vec3 n = normalize(vN); float f = 1.0 - abs(dot(n, normalize(vV)));
  float rim = smoothstep(0.62, 0.97, f);
  float glint = smoothstep(0.045, 0.0, abs(n.x - 0.55)) * 0.22;
  vec3 c = mix(uTint, uInk, rim*0.9); c = mix(c, vec3(1.0), glint);
  gl_FragColor = vec4(c, 0.06 + 0.8*rim + glint*0.5);
#include <colorspace_fragment>
}`
  });
}
function liquidMat(){
  return new THREE.ShaderMaterial({
    uniforms:{ uInk:{value:INK}, uCol:{value:new THREE.Color('#e2b84c')}, uCloudCol:{value:new THREE.Color('#f1ede2')}, uCloud:{value:0}, uLevel:{value:0} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:FRES_VS,
    fragmentShader:`uniform vec3 uInk; uniform vec3 uCol; uniform vec3 uCloudCol; uniform float uCloud; uniform float uLevel;
varying vec3 vN; varying vec3 vV; varying float vNy; varying float vY;
void main(){ if (vY > uLevel) discard;
  float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
  vec3 c = mix(uCol, uCloudCol, uCloud);
  c *= mix(1.0, 1.1, smoothstep(0.6, 0.95, vNy));
  float rim = smoothstep(0.75, 0.98, f);
  c = mix(c, uInk, rim*0.55);
  gl_FragColor = vec4(c, mix(0.55, 0.8, uCloud) + 0.25*rim);
#include <colorspace_fragment>
}`
  });
}
const bubbleMat = new THREE.ShaderMaterial({
  uniforms:{ uInk:{value:INK} }, transparent:true, depthWrite:false,
  vertexShader:`varying vec3 vN; varying vec3 vV;
void main(){ vec4 mv = modelViewMatrix * instanceMatrix * vec4(position,1.0);
  vN = normalize(normalMatrix * mat3(instanceMatrix) * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`uniform vec3 uInk; varying vec3 vN; varying vec3 vV;
void main(){ vec3 n = normalize(vN); float f = 1.0 - abs(dot(n, normalize(vV)));
  float rim = smoothstep(0.45, 0.95, f);
  float spec = smoothstep(0.82, 0.98, dot(n, normalize(vec3(-0.4,0.6,0.7))));
  vec3 c = mix(vec3(1.0), uInk, rim*0.85); c = mix(c, vec3(1.0), spec);
  gl_FragColor = vec4(c, 0.22 + 0.7*rim + spec*0.6);
#include <colorspace_fragment>
}`
});
function ribbonMat(){
  return new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uOp:{value:0}, uCol:{value:new THREE.Color(COL.co2)} },
    transparent:true, depthWrite:false,
    vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform float uTime; uniform float uOp; uniform vec3 uCol; varying vec2 vUv;
void main(){ float flow = fract(vUv.x*7.0 - uTime*1.3);
  float dots = smoothstep(0.16, 0.0, abs(flow - 0.5));
  float edge = smoothstep(0.0, 0.06, vUv.x) * smoothstep(1.0, 0.86, vUv.x);
  vec3 c = mix(uCol, vec3(0.85, 0.95, 1.0), dots*0.7);
  gl_FragColor = vec4(c, uOp * edge * (0.55 + 0.45*dots));
#include <colorspace_fragment>
}`
  });
}

/* ================= canvas textures ================= */
function makeCanvas(w,h){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = ANISO;
  return { cv, ctx, tex, w, h };
}

const _m4 = new THREE.Matrix4(), _bp = new THREE.Vector3(), _bq = new THREE.Quaternion(), _bs = new THREE.Vector3();

/* --- oxygen particles (산소) drifting inside a jar, used up by the flame --- */
function makeOxygen(n){
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map:DOT, color:'#5d9bff', size:0.042, transparent:true, depthWrite:false, opacity:0 }));
  pts.renderOrder = 8; pts.frustumCulled = false;
  return { pts, geo, n, list:[], show:0 };
}
function oxSpawn(O, p){ if (O.list.length < O.n) O.list.push({ p:p.clone(), v:V((Math.random()-0.5)*0.1, (Math.random()-0.2)*0.1, (Math.random()-0.5)*0.1), eat:false }); }
// centre = jar base centre (world), flame = flame tip (world), burnRate = particles consumed per second
function tickOxygen(O, dt, time, centre, flame, burnRate, burning){
  let eatBudget = burning ? burnRate*dt : 0;
  O.acc = (O.acc || 0) + eatBudget;
  for (let i=O.list.length-1;i>=0;i--){
    const o = O.list[i];
    if (o.eat){ const d = flame.clone().sub(o.p); const L = d.length(); if (L < 0.02){ O.list.splice(i, 1); continue; } o.p.addScaledVector(d.normalize(), Math.min(L, dt*0.9)); continue; }
    o.v.x += (Math.random()-0.5)*dt*0.8; o.v.y += (Math.random()-0.5)*dt*0.8; o.v.z += (Math.random()-0.5)*dt*0.8;
    o.v.multiplyScalar(1 - dt*0.6); o.p.addScaledVector(o.v, dt*0.6);
    const rx = o.p.x - centre.x, rz = o.p.z - centre.z, rr2 = Math.hypot(rx, rz), lim = JAR_R - 0.03;
    if (rr2 > lim){ o.p.x = centre.x + rx/rr2*lim; o.p.z = centre.z + rz/rr2*lim; o.v.x *= -0.5; o.v.z *= -0.5; }
    const y0 = centre.y + 0.04, y1 = centre.y + JAR_H - 0.04;
    if (o.p.y < y0){ o.p.y = y0; o.v.y = Math.abs(o.v.y); } if (o.p.y > y1){ o.p.y = y1; o.v.y = -Math.abs(o.v.y); }
  }
  while (O.acc >= 1 && O.list.length){ O.acc -= 1;
    let best = -1, bd = 1e9; O.list.forEach((o, i) => { if (o.eat) return; const d = o.p.distanceToSquared(flame); if (d < bd){ bd = d; best = i; } });
    if (best < 0) break; O.list[best].eat = true; }
  if (!O.list.length) O.acc = 0;
  const arr = O.geo.attributes.position.array; let n = 0;
  for (const o of O.list){ arr[n*3] = o.p.x; arr[n*3+1] = o.p.y; arr[n*3+2] = o.p.z; n++; }
  O.geo.setDrawRange(0, n); O.geo.attributes.position.needsUpdate = true;
  O.pts.material.opacity = O.show; O.pts.visible = O.show > 0.01;
  return O.list.filter(o => !o.eat).length;
}

  $('#sheetBody').querySelectorAll('.cover').forEach(b => b.onclick = () => { SHEET.open[b.dataset.cover] = true; b.classList.add('open'); saveSheet(); });
  $('#sheetBody').querySelectorAll('textarea').forEach(t => t.oninput = () => { SHEET.text[t.dataset.t] = t.value; saveSheet(); });
  saveSheet();
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { SHEET.mode = b.dataset.mode; renderSheet(); });
function openSheet(){ renderSheet(); $('#sheet').hidden = false; $('#sheetClose').focus(); S.sheetSeen = true; refreshHud(); }
function closeSheet(){ $('#sheet').hidden = true; canvas.focus(); }
$('#sheetClose').onclick = closeSheet;
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

/* ================= loop ================= */
function resize(){
  const w = innerWidth, h = innerHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  for (const m of lineMats) m.resolution.set(w, h);
}
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
let popT = -0.4, time = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  if (popT < 1.2){ popT += dt; const k = RM ? 1 : easeBack(clamp(popT/1.1, 0, 1)); app.scale.set(1, Math.max(0.001, k), 1); }
  if (tween){
    tween.t += dt; const k = easeIO(clamp(tween.t/tween.dur, 0, 1));
    camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= tween.dur) tween = null;
  }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('#toast').classList.remove('show'); }
  if (cardT > 0){ cardT -= dt; if (cardT <= 0) $('#card').hidden = true; }
  applyHeld(dt);
  { const p = camera.position, t = controls.target;
    if (!Number.isFinite(p.x + p.y + p.z + t.x + t.y + t.z)){ const s = STEP_CAM[S.step]; tween = null; p.set(...s.pos); t.set(...s.tgt); } }
  controls.update(); keepInBounds();
  simulate(dt, time);
  updateTags();
  if (S.step === 4 || S.step === 5 || S.step === 9 || S.step === 10) renderActs();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
/* ================= front view: button, double-tap zoom, magnetic snap ================= */
function frontView(target, dist, topDown){
  const t = target.clone();
  const d = dist ?? clamp(camera.position.distanceTo(controls.target), 1.6, 2.8);
  const el = topDown ? 1.05 : 0.2;
  const pos = V(t.x, t.y + Math.sin(el)*d, t.z + Math.cos(el)*d);
  tween = { t:0, dur: RM ? 0.01 : 0.9, p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:t };
  S.userCam = true;
  if (typeof stopPlay === 'function') stopPlay();
}
function snapAzimuth(){
  if (tween) return;
  const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off);
  if (Math.abs(sph.theta) < 0.35 && Math.abs(sph.theta) > 0.002){
    sph.theta = 0;
    const p1 = controls.target.clone().add(new THREE.Vector3().setFromSpherical(sph));
    tween = { t:0, dur: RM ? 0.01 : 0.45, p0:camera.position.clone(), t0:controls.target.clone(), p1, t1:controls.target.clone() };
  }
}
let camTurned = false;
{
  const mc = moveCamera;
  moveCamera = (a, b, c) => { if (a) camTurned = true; mc(a, b, c); };
  const settle = () => { if (camTurned){ camTurned = false; setTimeout(snapAzimuth, 60); } };
  addEventListener('pointerup', settle, true);
  addEventListener('keyup', settle, true);
  controls.addEventListener('start', () => { camTurned = true; });
  controls.addEventListener('end', () => setTimeout(settle, 250));
}
$('#bFront').onclick = () => frontView(controls.target.clone());
addEventListener('keydown', e => {
  const sh = $('#sheet'); if ((sh && !sh.hidden) || (e.target.closest && e.target.closest('button,textarea,input'))) return;
  if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') frontView(controls.target.clone());
});
{
  const zray = new THREE.Raycaster(), zndc = new THREE.Vector2();
  function zoomAt(cx, cy){ if (window.__camLocked) return;
    const r = canvas.getBoundingClientRect();
    zndc.set(((cx - r.left)/r.width)*2 - 1, -((cy - r.top)/r.height)*2 + 1);
    zray.setFromCamera(zndc, camera);
    const hit = zray.intersectObjects(book.children, true).find(h => h.object.isMesh && h.object.visible);
    if (!hit) return;
    const onPage = hit.object === pageL.mesh || hit.object === pageR.mesh;
    if (onPage) frontView(hit.point, 1.9, true);
    else frontView(hit.point, 1.5);
  }
  canvas.addEventListener('dblclick', e => zoomAt(e.clientX, e.clientY));
  let lastTap = null;
  canvas.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return;
    const now = performance.now();
    if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30){ lastTap = null; zoomAt(e.clientX, e.clientY); }
    else lastTap = { t:now, x:e.clientX, y:e.clientY };
  });
}


const VIEWS = { all:'all', left:'left', lab:() => S.step };
/* ================= fixed, kid-friendly camera ================= */
// Children cannot rotate, slide or zoom: they see the whole book first, then tap a side
// (or one of three big buttons) to jump to a fixed front view. Teachers can press T to unlock.
window.__camLocked = true;
let viewMode = 'overview';
{
  const st = document.createElement('style');
  st.textContent = `
#views{position:fixed; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(84px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:8px; padding:8px; background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:18px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:5}
#views button{display:flex; align-items:center; gap:10px; min-width:132px; min-height:52px; padding:0 16px; border-radius:12px;
  border:1px solid var(--hud-line); background:transparent; color:var(--hud-fg); font-size:16px; font-family:var(--f-ui, sans-serif); cursor:pointer}
#views button:hover{background:var(--hud-line)}
#views button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
#views button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#views .scroll{display:flex; gap:6px}
#views .scroll button{min-width:0; flex:1; padding:0 10px; white-space:nowrap; gap:4px}
#views svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
#views button{white-space:nowrap}
@media (max-width:620px){
  #views{flex-direction:row; bottom:calc(132px + env(safe-area-inset-bottom,0px)); right:auto; left:50%; transform:translateX(-50%); padding:6px; gap:6px}
  #views button{min-width:0; min-height:46px; padding:0 12px; font-size:14px}
}
@media (max-width:440px){ #views svg{display:none} #views button{padding:0 11px; font-size:13px; min-height:42px} #views{gap:4px; padding:5px} }`;
  document.head.appendChild(st);
  const box = document.createElement('nav'); box.id = 'views'; box.setAttribute('aria-label', '보는 위치 고르기');
  box.innerHTML =
    `<button data-v="all"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></svg>전체 보기</button>` +
    `<button data-v="left"><svg viewBox="0 0 24 24"><path d="M4 6c3-1.5 5-1.5 8 0v13c-3-1.5-5-1.5-8 0z"/><path d="M7 10h3M7 13h3"/></svg>책 읽기</button>` +
    `<button data-v="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7.5 15h9"/></svg>실험 보기</button>`;
  document.body.appendChild(box);
  box.insertAdjacentHTML('beforeend',
    `<div class="scroll" hidden><button data-s="-1" aria-label="책 위쪽 보기"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>위로</button>` +
    `<button data-s="1" aria-label="책 아래쪽 보기"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>아래로</button></div>`);
  const scrollBox = box.querySelector('.scroll');
  const keyOf = v => v === 'all' ? VIEWS.all : v === 'left' ? VIEWS.left : VIEWS.lab();
  box.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => { S.userCam = false; window.__readTop = b.dataset.v === 'left'; flyTo(keyOf(b.dataset.v)); });
  box.querySelectorAll('button[data-s]').forEach(b => b.onclick = () => scrollRead(+b.dataset.s * 0.5, true));
  const mark = k => { box.querySelectorAll('button[data-v]').forEach(b => b.setAttribute('aria-pressed', String(keyOf(b.dataset.v) === k))); scrollBox.hidden = k !== VIEWS.left; };

  // reading view: the left page fills the screen width, and children scroll it like a document
  const READ_MIN = -0.95, READ_MAX = 0.95, READ_EL = 1.5;
  let readZ = 0.5;
  function readDist(){
    const asp = Number.isFinite(camera.aspect) && camera.aspect > 0 ? camera.aspect : 1.6;
    const hf = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * asp);
    return Math.max(1.5, 1.18 / Math.tan(hf));
  }
  function readPose(z){ const d = readDist(); return { tgt:V(-1.05, PAGE_Y, z), pos:V(-1.05, PAGE_Y + d*Math.sin(READ_EL), z + d*Math.cos(READ_EL)) }; }
  function readAt(z, dur = 1.2){
    readZ = clamp(z, READ_MIN, READ_MAX); const P = readPose(readZ);
    tween = { t:0, dur: RM ? 0.01 : dur, p0:camera.position.clone(), t0:controls.target.clone(), p1:P.pos, t1:P.tgt };
  }
  function scrollRead(dz, smooth){
    if (viewMode !== 'read') return;
    const z = clamp(readZ + dz, READ_MIN, READ_MAX); if (z === readZ) return;
    if (smooth){ readAt(z, 0.5); return; }
    const d = z - readZ; readZ = z; tween = null;
    camera.position.z += d; controls.target.z += d;
  }
  window.__readAt = readAt;

  const fly0 = flyTo;
  flyTo = (k, cap) => {
    const r = fly0(k, cap);
    viewMode = k === VIEWS.all ? 'overview' : k === VIEWS.left ? 'read' : 'detail';
    mark(k);
    if (k === VIEWS.left){ readAt(window.__readTop ? READ_MIN : (window.__readZ ?? 0.55)); window.__readTop = false; window.__readZ = undefined;
      if (!cap) setCaption('위아래로 밀거나 ▲▼ 버튼을 눌러 책을 읽어요.'); }
    return r;
  };
  // swipe or wheel to scroll the reading view
  let sy = null;
  canvas.addEventListener('pointerdown', e => { if (viewMode === 'read') sy = { y:e.clientY, id:e.pointerId }; });
  canvas.addEventListener('pointermove', e => {
    if (!sy || e.pointerId !== sy.id || viewMode !== 'read') return;
    const dy = e.clientY - sy.y; sy.y = e.clientY;
    const per = 2 * readDist() * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) / (innerHeight || 800) / Math.sin(READ_EL);
    scrollRead(-dy * per, false);
  });
  addEventListener('pointerup', () => { sy = null; });
  canvas.addEventListener('wheel', e => { if (viewMode === 'read'){ e.preventDefault(); scrollRead(e.deltaY * 0.0015, false); } }, { passive:false });
  const mc0 = moveCamera, pc0 = panCamera, ah0 = applyHeld;
  moveCamera = (a, b, c) => { if (!window.__camLocked) mc0(a, b, c); };
  panCamera = (a, b) => { if (!window.__camLocked) pc0(a, b); };
  applyHeld = dt => { if (!window.__camLocked) ah0(dt); };

  const pad = document.getElementById('pad');
  function applyLock(){
    controls.enabled = !window.__camLocked;
    if (pad) pad.hidden = window.__camLocked;
    box.hidden = !window.__camLocked;
  }
  applyLock();
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('textarea,input')) return;
    if (e.key === 't' || e.key === 'T' || e.key === 'ㅅ'){
      window.__camLocked = !window.__camLocked; applyLock();
      toast(window.__camLocked ? '시점 고정: 아이들 화면으로 돌아왔어요.' : '선생님 모드: 화면을 자유롭게 돌릴 수 있어요. (T를 다시 누르면 고정)');
    }
  });

  // in the whole-book view, a tap on the book chooses which side to look at
  const ray0 = new THREE.Raycaster(), ndc0 = new THREE.Vector2();
  canvas.addEventListener('pointerdown', e => {
    if (!window.__camLocked || viewMode !== 'overview') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = canvas.getBoundingClientRect();
    ndc0.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
    ray0.setFromCamera(ndc0, camera);
    const hit = ray0.intersectObjects(book.children, true).find(h => h.object.isMesh);
    if (!hit) return;
    e.stopImmediatePropagation(); e.preventDefault();
    S.userCam = false;
    if (hit.point.x < 0) window.__readZ = hit.point.z;
    flyTo(hit.point.x < 0 ? VIEWS.left : VIEWS.lab());
  }, true);
}

(async () => {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`700 40px "Gowun Batang"`, '가나'), document.fonts.load(`400 40px "Gowun Batang"`, '가나'),
        document.fonts.load(`400 40px "Gowun Dodum"`, '가나'), document.fonts.load(`400 40px "Nanum Pen Script"`, '가나')
      ]),
      new Promise(r => setTimeout(r, 3500))
    ]);
  } catch (e) {}
  drawLeft(); drawRight(); refreshHud();
  app2.visible = false; app2.scale.set(1, 0.001, 1);
  flyTo('all');
  $('#veil').classList.add('gone');
  window.__bookReady = true;
  requestAnimationFrame(frame);
})();
</script>
